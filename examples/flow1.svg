<svg viewBox="0 0 900 640" width="900" font-family="PingFang SC,sans-serif">
      <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa3b5"/></marker></defs>

      <rect x="310" y="10" width="240" height="44" rx="22" fill="#192241" stroke="none"/>
      <text x="430" y="38" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">访客点击 CHAT NOW 打开插件</text>

      <!-- 主链对齐 x=430, 全程垂直竖线 -->
      <line x1="430" y1="54" x2="430" y2="74" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="310" y="74" width="240" height="40" rx="8" fill="#eef2ff" stroke="#4338ca"/>
      <text x="430" y="99" fill="#1e2a4a" font-size="13" text-anchor="middle">AI 主动问候（历史消息还原）</text>

      <!-- 问候框 -> 菱形1: 中心对齐(430), 纯垂直竖线 -->
      <line x1="430" y1="114" x2="430" y2="134" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>

      <polygon points="430,134 470,164 430,194 390,164" fill="#fff3cd" stroke="#d97706"/>
      <text x="430" y="160" fill="#b45309" font-size="12" text-anchor="middle">AI 开</text>
      <text x="430" y="175" fill="#b45309" font-size="11" text-anchor="middle">(ai_enabled)?</text>

      <line x1="390" y1="164" x2="280" y2="164" stroke="#9aa3b5" stroke-width="2"/>
      <text x="335" y="155" fill="#6b7280" font-size="11" text-anchor="middle">是</text>
      <rect x="90" y="138" width="190" height="52" rx="8" fill="#f0fdf4" stroke="#10b981"/>
      <text x="185" y="160" fill="#1e2a4a" font-size="12" text-anchor="middle">访客发消息 → AI 流式回复</text>
      <text x="185" y="178" fill="#6b7280" font-size="11" text-anchor="middle">(SSE 流式 /api/chat)</text>

      <line x1="185" y1="190" x2="185" y2="226" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="60" y="226" width="250" height="40" rx="8" fill="#fff" stroke="#334680" stroke-dasharray="4 3"/>
      <text x="185" y="244" fill="#334680" font-size="12" text-anchor="middle">AI 回答下方弹出商务咨询 CTA</text>
      <text x="185" y="259" fill="#6b7280" font-size="10.5" text-anchor="middle">&quot;Need a quote? Talk to our team&quot;</text>

      <line x1="185" y1="266" x2="185" y2="283" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="120" y1="283" x2="340" y2="283" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="120" y1="283" x2="120" y2="300" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="340" y1="283" x2="340" y2="300" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="128" y="290" fill="#6b7280" font-size="11">填商务咨询表单</text>
      <text x="362" y="290" fill="#6b7280" font-size="11">点&quot;Talk to a Human&quot;</text>

      <rect x="30" y="300" width="180" height="88" rx="8" fill="#f8faff" stroke="#1d4ed8"/>
      <text x="120" y="320" fill="#1e2a4a" font-size="12" text-anchor="middle">填写表单提交</text>
      <text x="120" y="336" fill="#6b7280" font-size="10.5" text-anchor="middle">(POST /api/lead)</text>
      <text x="120" y="354" fill="#047857" font-size="11" text-anchor="middle">ok 成功 → 1个工作日联系</text>
      <text x="120" y="371" fill="#6b7280" font-size="11" text-anchor="middle">坐席侧出现 Inquiry 卡片</text>

      <rect x="240" y="300" width="200" height="88" rx="8" fill="#f0f7ff" stroke="#2563eb"/>
      <text x="340" y="320" fill="#1e2a4a" font-size="12" text-anchor="middle">POST 转人工 → handoff=open</text>
      <text x="340" y="340" fill="#6b7280" font-size="10.5" text-anchor="middle">AI 暂停，显示&quot;等待坐席…&quot;</text>
      <text x="340" y="358" fill="#6b7280" font-size="11" text-anchor="middle">坐席接手后 assign → AI 关闭</text>
      <text x="340" y="375" fill="#b45309" font-size="11" text-anchor="middle">可随时 &quot;Back to AI&quot; 切回</text>

      <line x1="120" y1="388" x2="120" y2="420" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="340" y1="388" x2="340" y2="420" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="120" y1="420" x2="500" y2="420" stroke="#9aa3b5" stroke-width="2"/>
            <line x1="500" y1="420" x2="500" y2="440" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="470" y1="440" x2="500" y2="440" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="470" y1="440" x2="470" y2="460" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>

      <polygon points="470,460 510,490 470,520 430,490" fill="#fff3cd" stroke="#d97706"/>
      <text x="470" y="486" fill="#b45309" font-size="11" text-anchor="middle">有人工</text>
      <text x="470" y="500" fill="#b45309" font-size="10" text-anchor="middle">会话?</text>

      <line x1="430" y1="490" x2="320" y2="490" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="320" y1="490" x2="320" y2="560" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="195" y="560" width="250" height="52" rx="22" fill="#eef2ff" stroke="#4338ca"/>
      <text x="320" y="582" fill="#1e2a4a" font-size="12" text-anchor="middle">保持 2.5s 轮询人工消息，AI 侧继续等待</text>
      <text x="320" y="600" fill="#6b7280" font-size="10.5" text-anchor="middle">坐席来新消息 → 自动拉回人工窗口</text>

            <line x1="510" y1="490" x2="590" y2="490" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="590" y1="490" x2="590" y2="560" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="465" y="560" width="250" height="52" rx="22" fill="#f0fdf4" stroke="#10b981"/>
      <text x="590" y="582" fill="#1e2a4a" font-size="12" text-anchor="middle">人工接管 → 消息直达坐席，AI 不插话</text>
      <text x="590" y="600" fill="#6b7280" font-size="10.5" text-anchor="middle">(handoffActive &amp;&amp; !ai_enabled)</text>

    </svg>