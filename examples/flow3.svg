<svg viewBox="0 0 720 340" width="720" font-family="PingFang SC,sans-serif">
      <defs><marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa3b5"/></marker></defs>

      <rect x="200" y="10" width="280" height="40" rx="20" fill="#192241"/>
      <text x="340" y="36" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">访客发送一条消息</text>

      <!-- 发消息框 -> 菱形: 中心对齐(340), 纯垂直竖线 -->
      <line x1="340" y1="50" x2="340" y2="76" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow3)"/>
      <polygon points="340,76 380,102 340,128 300,102" fill="#fff3cd" stroke="#d97706"/>
      <text x="340" y="96" fill="#b45309" font-size="11" text-anchor="middle">人工会话</text>
      <text x="340" y="112" fill="#b45309" font-size="11" text-anchor="middle">且 AI 已关?</text>

      <line x1="300" y1="102" x2="190" y2="102" stroke="#9aa3b5" stroke-width="2"/>
      <text x="245" y="92" fill="#6b7280" font-size="11">是</text>
            <line x1="190" y1="102" x2="160" y2="102" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="160" y1="102" x2="160" y2="150" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow3)"/>
      <rect x="40" y="150" width="240" height="54" rx="10" fill="#f0fdf4" stroke="#10b981"/>
      <text x="160" y="172" fill="#1e2a4a" font-size="13" text-anchor="middle">转人工坐席</text>
      <text x="160" y="192" fill="#6b7280" font-size="11" text-anchor="middle">POST /chat/human/messages</text>

      <line x1="380" y1="102" x2="540" y2="102" stroke="#9aa3b5" stroke-width="2"/>
      <text x="460" y="92" fill="#6b7280" font-size="11">否</text>
            <line x1="540" y1="102" x2="560" y2="102" stroke="#9aa3b5" stroke-width="2"/>
      <line x1="560" y1="102" x2="560" y2="150" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow3)"/>
      <rect x="440" y="150" width="240" height="54" rx="10" fill="#eef2ff" stroke="#4338ca"/>
      <text x="560" y="172" fill="#1e2a4a" font-size="13" text-anchor="middle">交给 AI 机器人</text>
      <text x="560" y="192" fill="#6b7280" font-size="11" text-anchor="middle">POST /api/chat (SSE 流式)</text>

      <line x1="160" y1="204" x2="160" y2="250" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow3)"/>
      <rect x="40" y="250" width="240" height="44" rx="10" fill="#fff3cd" stroke="#d97706"/>
      <text x="160" y="269" fill="#b45309" font-size="12" text-anchor="middle">AI 中途被接管? -> suspended</text>
      <text x="160" y="285" fill="#6b7280" font-size="11" text-anchor="middle">前端自动把该消息转给坐席</text>

      <line x1="560" y1="204" x2="560" y2="250" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow3)"/>
      <rect x="440" y="250" width="240" height="44" rx="10" fill="#f0f7ff" stroke="#2563eb"/>
      <text x="560" y="269" fill="#1e2a4a" font-size="12" text-anchor="middle">AI 正常流式回答</text>
      <text x="560" y="285" fill="#6b7280" font-size="11" text-anchor="middle">同时坐席也能并行查看/插话</text>

    </svg>