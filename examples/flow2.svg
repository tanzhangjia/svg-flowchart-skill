<svg viewBox="0 0 1000 560" width="1000" font-family="PingFang SC,sans-serif">
      <defs><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa3b5"/></marker></defs>

            <rect x="330" y="10" width="280" height="44" rx="22" fill="#192241" stroke="none"/>
      <text x="470" y="38" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">坐席登录进入 → 打开客服工作台</text>

      <!-- 主链所有节点中心统一为 x=470, 全程垂直竖线 -->
      <line x1="470" y1="54" x2="470" y2="80" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>
      <rect x="310" y="80" width="320" height="50" rx="8" fill="#eef2ff" stroke="#4338ca"/>
      <text x="470" y="100" fill="#1e2a4a" font-size="13" text-anchor="middle">左侧会话列表 2.5s 自动刷新</text>
      <text x="470" y="118" fill="#6b7280" font-size="11" text-anchor="middle">open(待接) &gt; assigned(进行中) &gt; closed(已关闭)</text>

      <line x1="470" y1="130" x2="470" y2="156" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>
      <rect x="340" y="156" width="260" height="44" rx="8" fill="#fff" stroke="#334680" stroke-dasharray="4 3"/>
      <text x="470" y="176" fill="#334680" font-size="12" text-anchor="middle">点击会话 → 打开完整历史记录</text>
      <text x="470" y="193" fill="#6b7280" font-size="10.5" text-anchor="middle">(含商务咨询卡 + 全量消息)</text>

      <!-- 点击会话 -> 菱形: 纯垂直竖线(中心对齐470) -->
      <line x1="470" y1="200" x2="470" y2="230" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>
      <polygon points="470,230 570,256 470,282 370,256" fill="#fff3cd" stroke="#d97706"/>
      <text x="470" y="252" fill="#b45309" font-size="11" text-anchor="middle">会话</text>
      <text x="470" y="266" fill="#b45309" font-size="11" text-anchor="middle">状态?</text>

      <!-- open 分支: 从菱形左顶点水平引出 -> 垂直进框 (单拐弯) -->
      <line x1="370" y1="256" x2="215" y2="256" stroke="#9aa3b5" stroke-width="2"/>
      <text x="292" y="246" fill="#6b7280" font-size="11">open</text>
      <line x1="215" y1="256" x2="215" y2="300" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>
      <rect x="90" y="300" width="250" height="52" rx="8" fill="#f0f7ff" stroke="#2563eb"/>
      <text x="215" y="320" fill="#1e2a4a" font-size="12" text-anchor="middle">点 &quot;Take over&quot; 接手</text>
      <text x="215" y="337" fill="#6b7280" font-size="10.5" text-anchor="middle">状态→assigned · 自动加锁 · AI 关闭</text>

      <!-- assigned 分支: 菱形底垂直直下 -->
      <line x1="470" y1="282" x2="470" y2="300" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>
      <rect x="360" y="300" width="220" height="52" rx="8" fill="#f0fdf4" stroke="#10b981"/>
      <text x="470" y="320" fill="#1e2a4a" font-size="12" text-anchor="middle">assigned：已在服务</text>
      <text x="470" y="337" fill="#6b7280" font-size="10.5" text-anchor="middle">直接回复 / 加锁独占</text>

      <!-- closed 分支: 从菱形右顶点水平引出 -> 垂直进框 (单拐弯) -->
      <line x1="570" y1="256" x2="745" y2="256" stroke="#9aa3b5" stroke-width="2"/>
      <text x="700" y="246" fill="#6b7280" font-size="11">closed</text>
      <line x1="745" y1="256" x2="745" y2="300" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>
      <rect x="620" y="300" width="250" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
      <text x="745" y="320" fill="#1e2a4a" font-size="12" text-anchor="middle">已关闭：输入新消息</text>
      <text x="745" y="337" fill="#6b7280" font-size="10.5" text-anchor="middle">→ 自动重开为 assigned</text>

      <!-- 三入口 -> 核心服务区: 各自垂直直下落到框顶 -->
      <line x1="215" y1="352" x2="215" y2="400" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>
      <line x1="470" y1="352" x2="470" y2="400" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>
      <line x1="745" y1="352" x2="745" y2="400" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow2)"/>

      <rect x="180" y="400" width="640" height="130" rx="12" fill="#fff" stroke="#192241" stroke-width="2"/>
      <text x="500" y="424" fill="#192241" font-size="14" text-anchor="middle" font-weight="bold">坐席核心服务区（assigned）</text>
      <g font-size="12" fill="#1e2a4a">
        <rect x="252" y="436" width="140" height="34" rx="7" fill="#fef3c7" stroke="#d97706"/><text x="322" y="457" text-anchor="middle">回复消息</text>
        <rect x="430" y="436" width="140" height="34" rx="7" fill="#fef3c7" stroke="#d97706"/><text x="500" y="457" text-anchor="middle">Lock / Unlock 锁</text>
        <rect x="608" y="436" width="140" height="34" rx="7" fill="#fef3c7" stroke="#d97706"/><text x="678" y="457" text-anchor="middle">开关 AI(默认关)</text>
        <rect x="252" y="478" width="200" height="34" rx="7" fill="#eef2ff" stroke="#4338ca"/><text x="352" y="498" text-anchor="middle">Send inquiry form 推表单</text>
        <rect x="482" y="478" width="120" height="34" rx="7" fill="#f3f4f6" stroke="#9ca3af"/><text x="542" y="498" text-anchor="middle">Clear 清屏</text>
        <rect x="634" y="478" width="100" height="34" rx="7" fill="#f0fdf4" stroke="#10b981"/><text x="684" y="498" text-anchor="middle">处理 Inquiry</text>
      </g>
      <text x="500" y="528" fill="#6b7280" font-size="10.5" text-anchor="middle">任何人发新消息 → 仅加锁者有权回复，避免多坐席串台</text>
<text x="500" y="528" fill="#6b7280" font-size="10.5" text-anchor="middle">任何人发新消息 → 仅加锁者有权回复，避免多坐席串台</text>
</svg>