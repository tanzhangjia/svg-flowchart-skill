<!--
  decision-branch.svg — 判断菱形 + 分支模板
  ==========================================
  演示 R3/R5/R6:
  - 菱形是"夹心饼干": 上方块的中心 = 菱形上顶点 x (进线纯垂直)
  - 分支从菱形两侧水平引出, 单拐弯(L形)垂直进框
  - 分支方框间距 ≥20px, 不重叠
  - 菱形下方主链继续, 纯垂直
-->
<svg viewBox="0 0 760 380" width="760" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa3b5"/></marker>
  </defs>

  <!-- 进场块: 中心 x=340 = 菱形上顶点 -->
  <rect x="190" y="10" width="300" height="44" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="340" y="37" fill="#1e2a4a" font-size="13" text-anchor="middle">Input Event</text>

  <!-- 菱形: 上顶点(340,80) 与进场块中心对齐 -->
  <line x1="340" y1="54" x2="340" y2="80" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="340,80 430,110 340,140 250,110" fill="#fff3cd" stroke="#d97706"/>
  <text x="340" y="114" fill="#b45309" font-size="11" text-anchor="middle">决策?</text>

  <!-- 左分支: 菱形左顶点(250) -> 水平 -> 垂直进框(单拐弯) -->
  <line x1="250" y1="110" x2="150" y2="110" stroke="#9aa3b5" stroke-width="2"/>
  <text x="198" y="100" fill="#6b7280" font-size="11" text-anchor="middle">是</text>
  <line x1="150" y1="110" x2="150" y2="160" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="160" width="220" height="52" rx="8" fill="#f0fdf4" stroke="#10b981"/>
  <text x="150" y="184" fill="#1e2a4a" font-size="12" text-anchor="middle">Yes path</text>
  <text x="150" y="201" fill="#6b7280" font-size="10.5" text-anchor="middle">details…</text>

  <!-- 右分支: 菱形右顶点(430) -> 水平 -> 垂直进框 -->
  <line x1="430" y1="110" x2="530" y2="110" stroke="#9aa3b5" stroke-width="2"/>
  <text x="482" y="100" fill="#6b7280" font-size="11" text-anchor="middle">否</text>
  <line x1="530" y1="110" x2="530" y2="160" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="160" width="220" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="530" y="184" fill="#1e2a4a" font-size="12" text-anchor="middle">No path</text>
  <text x="530" y="201" fill="#6b7280" font-size="10.5" text-anchor="middle">details…</text>

  <!-- 间距检查: 左框[40-260] 右框[430-650] 间隙充足, 不重叠 -->

  <!-- 菱形底 -> 主链继续(纯垂直, 回到中心340) -->
  <line x1="340" y1="140" x2="340" y2="210" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="210" width="500" height="130" rx="12" fill="#fff" stroke="#192241" stroke-width="2"/>
  <text x="370" y="234" fill="#192241" font-size="13" text-anchor="middle" font-weight="bold">Merge / Result Area</text>
  <rect x="150" y="250" width="140" height="34" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="220" y="271" text-anchor="middle" font-size="11">Sub-act 1</text>
  <rect x="310" y="250" width="140" height="34" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="380" y="271" text-anchor="middle" font-size="11">Sub-act 2</text>
  <rect x="470" y="250" width="140" height="34" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="540" y="271" text-anchor="middle" font-size="11">Sub-act 3</text>
  <text x="370" y="308" fill="#6b7280" font-size="10.5" text-anchor="middle">各分支垂直落到框顶(允许不同位置)</text>
</svg>
