<!--
  h-v-ortho.svg — 正交连线基础模板
  =================================
  演示 R1/R2/R4 规则：
  - 主链所有节点中心对齐到同一 x → 连线纯垂直
  - 分支从菱形两侧水平引出 → 单拐弯进框
  - 箭头对准方框中心 / 菱形上顶点

  使用 viewBox 布局，不写死缩放。
-->
<svg viewBox="0 0 640 460" width="640" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa3b5"/></marker>
  </defs>

  <!-- 主链: 所有节点中心 x = 320 (对齐) -->
  <rect x="180" y="10" width="280" height="44" rx="22" fill="#192241" stroke="none"/>
  <text x="320" y="38" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">Start</text>

  <!-- R2: 由于中心对齐(320), 以下是纯垂直竖线, 零折弯 -->
  <line x1="320" y1="54" x2="320" y2="80" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="80" width="280" height="44" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="320" y="107" fill="#1e2a4a" font-size="13" text-anchor="middle">Step A</text>

  <line x1="320" y1="124" x2="320" y2="150" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 判断菱形: 上顶点 (320,150), 中心 x=320 与上方块对齐 -->
  <polygon points="320,150 400,176 320,202 240,176" fill="#fff3cd" stroke="#d97706"/>
  <text x="320" y="180" fill="#b45309" font-size="11" text-anchor="middle">判断?</text>

  <!-- 分支: 菱形两侧水平引出, 单拐弯(L形)垂直进框 -->
  <!-- 左分支 open -->
  <line x1="240" y1="176" x2="140" y2="176" stroke="#9aa3b5" stroke-width="2"/>
  <text x="188" y="166" fill="#6b7280" font-size="11" text-anchor="middle">是</text>
  <line x1="140" y1="176" x2="140" y2="220" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="220" width="200" height="48" rx="8" fill="#f0fdf4" stroke="#10b981"/>
  <text x="140" y="248" fill="#1e2a4a" font-size="12" text-anchor="middle">Branch A</text>

  <!-- 右分支 closed -->
  <line x1="400" y1="176" x2="500" y2="176" stroke="#9aa3b5" stroke-width="2"/>
  <text x="452" y="166" fill="#6b7280" font-size="11" text-anchor="middle">否</text>
  <line x1="500" y1="176" x2="500" y2="220" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="220" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="500" y="248" fill="#1e2a4a" font-size="12" text-anchor="middle">Branch B</text>

  <!-- 菱形底 → 主链继续: 纯垂直 -->
  <line x1="320" y1="202" x2="320" y2="268" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="268" width="240" height="48" rx="8" fill="#f0f7ff" stroke="#2563eb"/>
  <text x="320" y="296" fill="#1e2a4a" font-size="12" text-anchor="middle">Continue</text>

  <!-- 汇聚: 分支框各自垂直落到下方框顶(允许落框顶不同位置) -->
  <line x1="140" y1="268" x2="140" y2="360" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="268" x2="500" y2="360" stroke="#9aa3b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="360" width="400" height="70" rx="12" fill="#fff" stroke="#192241" stroke-width="2"/>
  <rect x="132" y="386" width="120" height="28" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="192" y="405" text-anchor="middle" font-size="11">Action 1</text>
  <rect x="260" y="386" width="120" height="28" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="405" text-anchor="middle" font-size="11">Action 2</text>
  <rect x="388" y="386" width="120" height="28" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="448" y="405" text-anchor="middle" font-size="11">Action 3</text>
</svg>
